apiVersion: marlin/v1
kind: Package

metadata:
  name: devxtoolkit-v1
  version: 1.4.0
  description: PowerShell module of ergonomic developer-workflow commands — project/config scaffolding, CI/docs/license generation, Python/Node environment scaffolding
  author: jj-ervin
  homepage: https://github.com/dxp-org/devxtoolkit-v1-x-registry
  license: MIT
  tags:
    - powershell
    - dev-tooling
    - scaffolding
    - cli

platforms:
  windows:
    artifact:
      type: powershell-gallery
      name: DevXToolkit
      version: 1.4.0
    install:
      - step: command
        shell: pwsh
        run: Install-PSResource -Name DevXToolkit -Version 1.4.0 -Repository PSGallery -Scope CurrentUser -TrustRepository
    uninstall:
      - step: command
        shell: pwsh
        run: Uninstall-PSResource -Name DevXToolkit -Version 1.4.0 -Scope CurrentUser
  linux:
    artifact:
      type: powershell-gallery
      name: DevXToolkit
      version: 1.4.0
    install:
      - step: command
        shell: pwsh
        run: Install-PSResource -Name DevXToolkit -Version 1.4.0 -Repository PSGallery -Scope CurrentUser -TrustRepository
    uninstall:
      - step: command
        shell: pwsh
        run: Uninstall-PSResource -Name DevXToolkit -Version 1.4.0 -Scope CurrentUser
  macos:
    artifact:
      type: powershell-gallery
      name: DevXToolkit
      version: 1.4.0
    install:
      - step: command
        shell: pwsh
        run: Install-PSResource -Name DevXToolkit -Version 1.4.0 -Repository PSGallery -Scope CurrentUser -TrustRepository
    uninstall:
      - step: command
        shell: pwsh
        run: Uninstall-PSResource -Name DevXToolkit -Version 1.4.0 -Scope CurrentUser
